name: Start a publication
description: Begin a Bookself publication — no Git or folder-copy knowledge required
title: "[Start a publication]: "
labels: ["proposal"]
body:
  - type: markdown
    attributes:
      value: |
        You bring the publication. We can help with the computer-shaped parts.

        This form is enough to scaffold a new Bookself publication for a human
        or connected agent to finish setting up. You do not need to invent a
        folder name, know Markdown, or know what a branch is.

        **Privacy note:** issues have the visibility of this repository. If
        this is a public repo, this form is public. Do not paste private
        manuscript text here. A private Desk is the right place for drafts
        that must stay private.

  - type: dropdown
    id: format
    attributes:
      label: What are you starting?
      description: Pick the closest shape. This chooses a starter, not a permanent publishing category.
      options:
        - Book
        - Course text / textbook
        - Research paper / whitepaper
        - Magazine / zine
        - Newspaper / gazette
        - Journal / proceedings
        - Newsletter / bulletin
        - Anthology / collection
        - Report
        - Manual / handbook / guide
        - Comic / graphic narrative
        - Other long-form publication
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Working title
      description: It can change later. Publications are famously inconsiderate about titles.
      placeholder: e.g. The Long Way Home
    validations:
      required: true

  - type: input
    id: authors
    attributes:
      label: Author or authors
      description: Names or GitHub usernames are both fine.
      placeholder: e.g. Ada Writer
    validations:
      required: true

  - type: textarea
    id: premise
    attributes:
      label: What is this publication trying to do?
      description: One paragraph is plenty. A messy paragraph is still a paragraph.
      placeholder: This publication is about…
    validations:
      required: true

  - type: textarea
    id: audience
    attributes:
      label: Who do you imagine reading it?
      description: No market-analysis costume required. Just describe the reader you have in mind.
      placeholder: Someone who…
    validations:
      required: false

  - type: textarea
    id: chapters
    attributes:
      label: Any structure ideas yet?
      description: Optional. Chapters, sections, fragments, or “absolutely no idea yet” are all acceptable.
      placeholder: |
        Opening or abstract
        The part where everything gets interesting
        A surprisingly useful appendix or references section
    validations:
      required: false

  - type: input
    id: slug
    attributes:
      label: Preferred folder name, if you care
      description: Optional. Leave blank and a tidy lowercase-hyphen name can be made from the title.
      placeholder: the-long-way-home
    validations:
      required: false

  - type: dropdown
    id: stage
    attributes:
      label: Where are you in the writing lifecycle?
      description: This helps the setup meet you where you are.
      options:
        - I have an idea and need a place to begin
        - I have notes or an outline
        - I already have draft material elsewhere
        - I am revising an existing manuscript
        - I am preparing something for publication
    validations:
      required: true

  - type: checkboxes
    id: understanding
    attributes:
      label: Tiny expectations check
      options:
        - label: I understand this form starts the setup; the actual manuscript lives in publication files, not in this issue.
          required: true
