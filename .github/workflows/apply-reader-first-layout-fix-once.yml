name: Apply reader first-layout fix once

on:
  push:
    branches:
      - fix/reader-first-layout
    paths:
      - .github/workflows/apply-reader-first-layout-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reader-first-layout
          fetch-depth: 0

      - name: Patch first-render geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          surface = Path('reader/js/reading-surface.js')
          text = surface.read_text()

          import_needle = "import { installFontReadiness } from './font-readiness-runtime.js';\n"
          assert import_needle in text and "./spread-state.js" not in text
          text = text.replace(
              import_needle,
              import_needle + "import { intendedPagedSpread } from './spread-state.js';\n",
              1,
          )

          old_sync = (
              "function syncSpreadState() {\n"
              "  const right = document.getElementById('pageRight');\n"
              "  const wrapper = document.getElementById('pagesWrapper');\n"
              "  if (!wrapper) return;\n"
              "  const spread = !!right?.classList.contains('active');\n"
              "  wrapper.dataset.readerSpread = spread ? 'spread' : 'single';\n"
              "}\n"
          )
          new_sync = (
              "function syncSpreadState() {\n"
              "  const right = document.getElementById('pageRight');\n"
              "  const wrapper = document.getElementById('pagesWrapper');\n"
              "  const toggle = document.getElementById('viewModeBtn');\n"
              "  if (!wrapper) return;\n"
              "  const spread = intendedPagedSpread({\n"
              "    stage: document.body.dataset.stage || '',\n"
              "    mode: root().dataset.readerMode || 'paged',\n"
              "    rightActive: !!right?.classList.contains('active'),\n"
              "    toggleHidden: !!toggle?.hidden,\n"
              "    toggleLabel: toggle?.textContent || '',\n"
              "  });\n"
              "  wrapper.dataset.readerSpread = spread ? 'spread' : 'single';\n"
              "}\n"
          )
          assert old_sync in text
          text = text.replace(old_sync, new_sync, 1)

          stage_needle = "  const stageObserver = new MutationObserver(() => {\n    syncModeSemantics();"
          stage_replacement = "  const stageObserver = new MutationObserver(() => {\n    syncSpreadState();\n    syncModeSemantics();"
          assert stage_needle in text
          text = text.replace(stage_needle, stage_replacement, 1)
          surface.write_text(text)

          Path('reader/js/spread-state.js').write_text('''/**
           * Resolve the page geometry the core reader intends before the first
           * visible page has been painted. The legacy signal (right page is
           * active) is unavailable during initial pagination, so the view-mode
           * control is the authoritative pre-paint hint: when it offers
           * "Single", the current mode is Spread.
           */
          export function intendedPagedSpread({
            stage = '',
            mode = 'paged',
            rightActive = false,
            toggleHidden = true,
            toggleLabel = '',
          } = {}) {
            if (stage !== 'read' || mode === 'scroll') return false;
            if (rightActive) return true;
            return !toggleHidden && /^single$/i.test(String(toggleLabel).trim());
          }
          ''')

          Path('reader/js/spread-state.test.mjs').write_text('''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { intendedPagedSpread } from './spread-state.js';

          test('uses the requested spread before the right page has painted', () => {
            assert.equal(intendedPagedSpread({
              stage: 'read', mode: 'paged', rightActive: false,
              toggleHidden: false, toggleLabel: 'Single',
            }), true);
          });

          test('keeps a requested single-page layout single before paint', () => {
            assert.equal(intendedPagedSpread({
              stage: 'read', mode: 'paged', rightActive: false,
              toggleHidden: false, toggleLabel: 'Spread',
            }), false);
          });

          test('never invents a spread when the spread control is unavailable', () => {
            assert.equal(intendedPagedSpread({
              stage: 'read', mode: 'paged', rightActive: false,
              toggleHidden: true, toggleLabel: 'Single',
            }), false);
          });

          test('preserves painted spread and ignores stale pages in scroll mode', () => {
            assert.equal(intendedPagedSpread({ stage: 'read', rightActive: true }), true);
            assert.equal(intendedPagedSpread({ stage: 'read', mode: 'scroll', rightActive: true }), false);
          });
          ''')

          index = Path('reader/index.html')
          html = index.read_text()
          css_needle = '  <link rel="stylesheet" href="css/shelf-gui.css?v=r1">\n'
          css_line = '  <link rel="stylesheet" href="css/navigation.css?v=r2" data-reader-navigation="true" data-reader-critical="true">\n'
          assert css_needle in html
          if css_line not in html:
              html = html.replace(css_needle, css_needle + css_line, 1)
          index.write_text(html)

          sw = Path('reader/sw.js')
          sw_text = sw.read_text()
          assert "const CACHE = 'obb-shell-v106';" in sw_text
          sw_text = sw_text.replace("const CACHE = 'obb-shell-v106';", "const CACHE = 'obb-shell-v107';", 1)
          shell_needle = "  './js/reading-surface.js',\n"
          assert shell_needle in sw_text
          if "  './js/spread-state.js',\n" not in sw_text:
              sw_text = sw_text.replace(shell_needle, shell_needle + "  './js/spread-state.js',\n", 1)
          sw.write_text(sw_text)
          PY

      - name: Validate reader fix
        shell: bash
        run: |
          set -euo pipefail
          node --check reader/js/reading-surface.js
          node --check reader/js/spread-state.js
          node --test reader/js/spread-state.test.mjs
          grep -F 'data-reader-navigation="true"' reader/index.html
          grep -F "const CACHE = 'obb-shell-v107';" reader/sw.js

      - name: Commit patched reader
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-reader-first-layout-fix-once.yml
          git config user.name 'Sven Benson'
          git config user.email '129682319+Svyable@users.noreply.github.com'
          git add reader/js/reading-surface.js reader/js/spread-state.js reader/js/spread-state.test.mjs reader/index.html reader/sw.js .github/workflows/apply-reader-first-layout-fix-once.yml
          git commit -m 'fix: stabilize initial reader pagination'
          git push origin HEAD:fix/reader-first-layout
