name: Compatibility

on:
  push:
    paths:
      - 'scripts/**'
      - 'reader/**'
      - 'desk/**'
      - 'REQUIREMENTS.md'
      - 'docs/compatibility.md'
      - '.github/workflows/compatibility.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'reader/**'
      - 'desk/**'
      - 'REQUIREMENTS.md'
      - 'docs/compatibility.md'
      - '.github/workflows/compatibility.yml'

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m compileall -q scripts
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/doctor.py --root .
      - run: node reader/js/presentation.test.mjs
