name: Temporary Bookself Sven Hardy Benson migration

on:
  push:
    branches:
      - cleanup/sven-hardy-benson-book-branding

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update stale book-facing name references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              Path('books/bookself-101/manuscript/front-matter.md'),
              Path('books/how-to-bookself/manuscript/front-matter.md'),
              Path('books/how-to-bookself/manuscript/back-matter.md'),
          ]

          replacements = {
              '© 2026 Svyable. All rights reserved.': '© 2026 Sven Hardy Benson. All rights reserved.',
              'Svyable maintains Bookself.': 'Sven Hardy Benson maintains Bookself.',
          }

          for path in targets:
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Verify publication tree is clean
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          roots = sorted(Path('books').rglob('*.md'))
          roots += sorted(Path('books').rglob('*.json'))
          roots += sorted(Path('books').rglob('*.txt'))
          roots += sorted(Path('books').rglob('*.yml'))
          roots += sorted(Path('books').rglob('*.yaml'))

          legacy = re.compile(r'\bsvyable\b', re.IGNORECASE)
          raw_url = re.compile(r'https?://[^\s)>\]}]+', re.IGNORECASE)
          repo_code = re.compile(r'`Svyable/[A-Za-z0-9._/-]+`', re.IGNORECASE)
          repo_link = re.compile(r'\[Svyable/[A-Za-z0-9._/-]+\]\([^)]*\)', re.IGNORECASE)
          matches = []

          for path in roots:
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for line_number, line in enumerate(text.splitlines(), start=1):
                  visible = raw_url.sub('', line)
                  visible = repo_code.sub('', visible)
                  visible = repo_link.sub('', visible)
                  if legacy.search(visible):
                      matches.append((path, line_number, line.strip()))

          if matches:
              print(f'REMAINING_VISIBLE_MATCH_COUNT={len(matches)}')
              for path, line_number, line in matches:
                  print(f'{path}:{line_number}: {line}')
              sys.exit(1)
          print('Bookself publication tree legacy-name check passed.')
          PY

      - name: Commit book-content migration
        shell: bash
        run: |
          if git diff --quiet -- books; then
            echo "No book-content migration changes needed."
            exit 0
          fi
          git config user.name "Sven Benson"
          git config user.email "129682319+Svyable@users.noreply.github.com"
          git add books
          git commit -m "Standardize Bookself publications on Sven Hardy Benson"
          git push origin HEAD:cleanup/sven-hardy-benson-book-branding
