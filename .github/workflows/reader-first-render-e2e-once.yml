name: One-shot Reader first-render acceptance

on:
  push:
    branches:
      - fix/reader-first-render-mobile-contents
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check Reader source contracts
        run: |
          node --check reader/js/reader-first-render.js
          node --check reader/js/app-loader.js
          node --check reader/js/gui.js
          node --check reader/js/imprint.js
          node --check reader/js/app.js
          node --test \
            tests/reader-first-layout-contract.test.mjs \
            tests/reader-contents-navigation.test.mjs \
            tests/reader-cache-coherence.test.mjs \
            tests/reader-asset-version.test.mjs \
            tests/reader-first-paint.test.mjs \
            tests/reader-startup-budget.test.mjs
      - name: Install Chromium harness
        run: |
          mkdir -p /tmp/reader-e2e
          npm install --prefix /tmp/reader-e2e playwright@1.55.0
          npx --prefix /tmp/reader-e2e playwright install --with-deps chromium
      - name: Trace phone first-open startup
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/reader-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/reader/ >/dev/null; then break; fi
            sleep 0.25
          done
          cat >/tmp/reader-e2e/reader-startup-trace.mjs <<'EOF'
          import { chromium } from 'playwright';

          const base = 'http://127.0.0.1:4173/';
          const route = 'reader/?b=bookself-review&c=issue-01&o=0#/b/bookself-review/issue-01/0';
          const saved = {
            fontSize: 22,
            font: 'classic',
            fontWeight: 500,
            tracking: 0.02,
            leading: 1.8,
            measure: 'narrow',
            align: 'left',
            paragraph: 'airy',
            indent: 'gentle',
            mode: 'paged',
            hyphens: 'off',
          };
          const interesting = (url) => (
            url.startsWith(base)
            && (url.includes('/reader/') || url.includes('/books/') || url.endsWith('/imprint.json') || url.endsWith('/catalog.json'))
          );

          const browser = await chromium.launch({ headless: true });
          try {
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              hasTouch: true,
              isMobile: true,
            });
            await context.route('https://fonts.googleapis.com/**', (route) => route.abort());
            await context.route('https://fonts.gstatic.com/**', (route) => route.abort());
            await context.addInitScript((prefs) => {
              localStorage.setItem('bookself-demo:reader-experience', JSON.stringify(prefs));
            }, saved);
            const page = await context.newPage();
            page.setDefaultTimeout(12000);
            page.setDefaultNavigationTimeout(15000);
            page.on('console', (message) => {
              console.log(`PAGE_CONSOLE ${message.type()} ${message.text()}`);
            });
            page.on('pageerror', (error) => {
              console.log(`PAGE_ERROR ${error.message}`);
            });
            page.on('request', (request) => {
              if (interesting(request.url())) console.log(`REQUEST ${request.resourceType()} ${request.url()}`);
            });
            page.on('requestfinished', (request) => {
              if (interesting(request.url())) console.log(`FINISHED ${request.resourceType()} ${request.url()}`);
            });
            page.on('requestfailed', (request) => {
              const url = request.url();
              if (!url.startsWith('https://fonts.googleapis.com/') && !url.startsWith('https://fonts.gstatic.com/')) {
                console.log(`FAILED ${request.resourceType()} ${url} ${request.failure()?.errorText || ''}`);
              }
            });
            page.on('response', (response) => {
              if (interesting(response.url())) console.log(`RESPONSE ${response.status()} ${response.url()}`);
            });

            console.log('TRACE navigate');
            await page.goto(`${base}${route}`, { waitUntil: 'commit', timeout: 15000 });
            console.log('TRACE committed');

            await page.waitForFunction(() => {
              const root = document.documentElement;
              const visible = document.querySelector('#pagesWrapper .page-surface.active .page-inner');
              return root.dataset.readerFirstRenderReady === 'true'
                && root.dataset.readerPrefsPrimed === 'true'
                && document.body?.dataset.stage === 'read'
                && document.getElementById('pagesWrapper')?.classList.contains('active')
                && !!visible
                && Number(document.getElementById('totalPages')?.textContent || '0') > 0;
            }, null, { timeout: 20000 });
            console.log('TRACE visible');
            await context.close();
          } finally {
            await browser.close();
          }
          EOF
          timeout --signal=TERM 70s node /tmp/reader-e2e/reader-startup-trace.mjs
