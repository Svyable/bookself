name: Shelf instance boundary

on:
  pull_request:
    paths:
      - "scripts/sync-ui.py"
      - "scripts/stamp-instance.py"
      - "scripts/instance_identity.py"
      - "scripts/doctor.py"
      - "scripts/doctor_pair.py"
      - "tests/test_sync_ui.py"
      - "tests/test_stamp_instance.py"
      - "tests/test_doctor_roles.py"
      - ".github/workflows/shelf-sync-boundary.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/sync-ui.py"
      - "scripts/stamp-instance.py"
      - "scripts/instance_identity.py"
      - "scripts/doctor.py"
      - "scripts/doctor_pair.py"
      - "tests/test_sync_ui.py"
      - "tests/test_stamp_instance.py"
      - "tests/test_doctor_roles.py"
      - ".github/workflows/shelf-sync-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Shelf creation, health, and safe-sync ownership
        run: python3 -m unittest discover -s tests -p 'test_*.py'
