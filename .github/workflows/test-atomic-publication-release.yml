name: Temporary atomic publication release validation

on:
  push:
    branches:
      - publishing/atomic-publication-web
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          python3 -m py_compile scripts/release.py scripts/release-book.py scripts/generate-publication-pages.py
      - name: Release transaction tests
        run: |
          python3 -m unittest scripts/test_release_book.py scripts/test_release.py
      - name: Publication page tests
        run: python3 scripts/test-publication-pages.py
