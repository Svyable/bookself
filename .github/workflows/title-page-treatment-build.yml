name: Build Reader title-page treatment

on:
  push:
    branches:
      - reader-title-page-treatment

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reader-title-page-treatment
      - name: Add title-page classifier and styling
        run: |
          cat > reader/js/title-page.js <<'EOF'
          function plainInline(value) {
            return String(value || '')
              .replace(/^\*\*(.+)\*\*$/, '$1')
              .replace(/^__(.+)__$/, '$1')
              .replace(/^\*(.+)\*$/, '$1')
              .replace(/^_(.+)_$/, '$1')
              .replace(/^by\s+/i, '')
              .replace(/\s+/g, ' ')
              .trim();
          }

          function firstHeading(markdown) {
            return String(markdown || '').match(/^#\s+(.+)$/m)?.[1]?.trim() || '';
          }

          export function isTitlePageChapter(chapter, book) {
            if (!chapter) return false;
            const id = String(chapter.id || '').trim();
            const label = String(chapter.title || '').trim();
            if (/(?:^|-)front-matter$/i.test(id) || /^front matter\b/i.test(label)) return true;

            const chapters = Array.isArray(book?.chapters) ? book.chapters : [];
            const index = chapters.findIndex((candidate) => candidate === chapter || candidate?.id === chapter.id);
            if (index !== 0) return false;

            const markdown = String(chapter.markdown || '');
            const bookTitle = String(book?.title || '').trim();
            if (!bookTitle || firstHeading(markdown) !== bookTitle) return false;

            const opening = markdown.split(/^\s*---\s*$/m, 1)[0];
            const author = plainInline(book?.authors || '');
            const lines = opening.split(/\n/).map((line) => line.trim()).filter(Boolean).slice(1);
            return lines.some((line) => {
              const bold = line.match(/^(?:\*\*|__)(.+?)(?:\*\*|__)$/);
              if (!bold) return false;
              const value = plainInline(bold[1]);
              return author ? value.toLowerCase() === author.toLowerCase() : value.length > 1;
            });
          }
          EOF

          cat > reader/css/title-page.css <<'EOF'
          /* Canonical book title pages
             --------------------------
             Structural styling for the opening title block. This stylesheet is
             loaded before pagination so the measurement surface and visible page
             use the same typography. Manuscript Markdown remains untouched. */

          .page-surface.title-page-leaf .page-running,
          .page-surface.title-page-leaf .page-num {
            opacity: 0;
          }

          .page-inner.title-page-chapter.chapter-open > h1:first-child,
          .scroll-chapter.title-page-chapter > .scroll-block:first-child:has(> h1:first-child) > h1:first-child {
            max-width: 15ch;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 0;
            color: var(--text-primary);
            font-family: var(--font-display);
            font-size: clamp(2.15rem, 3.05em, 3.9rem);
            font-weight: 500;
            letter-spacing: -0.018em;
            line-height: 1.02;
            text-align: center;
            text-wrap: balance;
          }

          .page-inner.title-page-chapter.chapter-open > h1:first-child {
            margin-top: clamp(1.35rem, 7vh, 4.4rem);
          }

          .scroll-chapter.title-page-chapter > .scroll-block:first-child:has(> h1:first-child) > h1:first-child {
            margin-top: clamp(3rem, 11vh, 7rem);
          }

          .page-inner.title-page-chapter.chapter-open > h1:first-child + p:has(> em:only-child),
          .scroll-chapter.title-page-chapter > .scroll-block:first-child:has(> h1:first-child) + .scroll-block:has(> p > em:only-child) > p {
            max-width: 34ch;
            margin: 1.2em auto 0;
            color: var(--text-secondary);
            font-family: var(--font-accent);
            font-size: 1.13em;
            line-height: 1.36;
            text-align: center;
            text-wrap: balance;
          }

          .page-inner.title-page-chapter.chapter-open > h1:first-child + p:has(> em:only-child) > em,
          .scroll-chapter.title-page-chapter > .scroll-block:first-child:has(> h1:first-child) + .scroll-block:has(> p > em:only-child) > p > em {
            font-style: italic;
          }

          .page-inner.title-page-chapter.chapter-open > h1:first-child + p:has(> strong:only-child),
          .page-inner.title-page-chapter.chapter-open > h1:first-child + p:has(> em:only-child) + p:has(> strong:only-child),
          .scroll-chapter.title-page-chapter > .scroll-block:first-child:has(> h1:first-child) + .scroll-block:has(> p > strong:only-child) > p,
          .scroll-chapter.title-page-chapter > .scroll-block:first-child:has(> h1:first-child) + .scroll-block:has(> p > em:only-child) + .scroll-block:has(> p > strong:only-child) > p {
            margin: 1.9em auto 0;
            color: color-mix(in srgb, var(--accent) 78%, var(--text-primary));
            font-family: var(--font-ui);
            font-size: 0.82em;
            letter-spacing: 0.2em;
            line-height: 1.35;
            text-align: center;
            text-transform: uppercase;
          }

          .page-inner.title-page-chapter.chapter-open > h1:first-child + p:has(> strong:only-child) > strong,
          .page-inner.title-page-chapter.chapter-open > h1:first-child + p:has(> em:only-child) + p:has(> strong:only-child) > strong,
          .scroll-chapter.title-page-chapter > .scroll-block:first-child:has(> h1:first-child) + .scroll-block:has(> p > strong:only-child) > p > strong,
          .scroll-chapter.title-page-chapter > .scroll-block:first-child:has(> h1:first-child) + .scroll-block:has(> p > em:only-child) + .scroll-block:has(> p > strong:only-child) > p > strong {
            font-weight: 600;
          }

          /* The generic chapter drop cap must never turn a subtitle/byline into a decorative initial. */
          .page-inner.title-page-chapter.chapter-open > p:first-of-type::first-letter,
          html[data-book-interior="true"] .page-inner.title-page-chapter.chapter-open > p:first-of-type::first-letter,
          .scroll-chapter.title-page-chapter > .scroll-block:first-child:has(> h1) + .scroll-block:has(> p) > p::first-letter,
          html[data-book-interior="true"] .scroll-chapter.title-page-chapter > .scroll-block:first-child:has(> h1) + .scroll-block:has(> p) > p::first-letter {
            float: none;
            padding: 0;
            color: inherit;
            font: inherit;
            text-shadow: none;
          }

          .page-inner.title-page-chapter.chapter-open > hr:first-of-type {
            width: 4.2rem;
            margin: 2.35em auto 0;
            border-top-color: color-mix(in srgb, var(--accent) 42%, transparent);
          }

          /* Title pages use their own quiet rule instead of the ordinary chapter ornament. */
          html[data-book-interior="true"] .page-inner.title-page-chapter.chapter-open > h1:first-child::before,
          html[data-book-interior="true"] .page-inner.title-page-chapter.chapter-open > h1:first-child::after,
          html[data-book-interior="true"] .scroll-chapter.title-page-chapter > .scroll-block:first-child:has(> h1) > h1::before,
          html[data-book-interior="true"] .scroll-chapter.title-page-chapter > .scroll-block:first-child:has(> h1) > h1::after {
            display: none;
            content: none;
          }

          @media (max-width: 700px) {
            .page-inner.title-page-chapter.chapter-open > h1:first-child,
            .scroll-chapter.title-page-chapter > .scroll-block:first-child:has(> h1:first-child) > h1:first-child {
              max-width: 18ch;
              font-size: clamp(1.9rem, 2.65em, 3rem);
            }

            .page-inner.title-page-chapter.chapter-open > h1:first-child {
              margin-top: 0.8rem;
            }
          }

          @media (forced-colors: active) {
            .page-inner.title-page-chapter.chapter-open > h1:first-child + p:has(> strong:only-child),
            .page-inner.title-page-chapter.chapter-open > h1:first-child + p:has(> em:only-child) + p:has(> strong:only-child) {
              color: CanvasText;
            }
          }

          @media print {
            .page-surface.title-page-leaf .page-running,
            .page-surface.title-page-leaf .page-num {
              visibility: hidden;
            }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          index = Path('reader/index.html')
          text = index.read_text(encoding='utf-8')
          needle = '  <link rel="stylesheet" href="css/style.css?v=r11">\n'
          addition = needle + '  <link rel="stylesheet" href="css/title-page.css?v=r1">\n'
          if needle not in text:
              raise SystemExit('style.css link anchor not found')
          index.write_text(text.replace(needle, addition, 1), encoding='utf-8')

          app = Path('reader/js/app.js')
          text = app.read_text(encoding='utf-8')
          anchor = "import { paginateBlocks, pageIndexForOffset } from './paginate.js';\n"
          if anchor not in text:
              raise SystemExit('app import anchor not found')
          text = text.replace(anchor, anchor + "import { isTitlePageChapter } from './title-page.js';\n", 1)

          old = """    for (const ch of book.chapters) {\n      const blocks = blocksFromMarkdown(ch.markdown, book.slug);\n      pages.push(...paginateBlocks(ch.id, blocks, box));\n    }\n"""
          new = """    for (const ch of book.chapters) {\n      box.classList.toggle('title-page-chapter', isTitlePageChapter(ch, book));\n      const blocks = blocksFromMarkdown(ch.markdown, book.slug);\n      pages.push(...paginateBlocks(ch.id, blocks, box));\n    }\n    box.classList.remove('title-page-chapter');\n"""
          if old not in text:
              raise SystemExit('noncooperative pagination anchor not found')
          text = text.replace(old, new, 1)

          old = """    const result = await paginationScheduler.run(book.chapters, (ch) => {\n      const blocks = blocksFromMarkdown(ch.markdown, book.slug);\n      return paginateBlocks(ch.id, blocks, box);\n    });\n"""
          new = """    const result = await paginationScheduler.run(book.chapters, (ch) => {\n      box.classList.toggle('title-page-chapter', isTitlePageChapter(ch, book));\n      const blocks = blocksFromMarkdown(ch.markdown, book.slug);\n      return paginateBlocks(ch.id, blocks, box);\n    });\n    box.classList.remove('title-page-chapter');\n"""
          if old not in text:
              raise SystemExit('cooperative pagination anchor not found')
          text = text.replace(old, new, 1)

          old = """  inner.innerHTML = page ? page.html : '';\n  inner.classList.toggle('chapter-open', !!(page && isChapterOpen(page.html)));\n"""
          new = """  inner.innerHTML = page ? page.html : '';\n  const chapterOpen = !!(page && isChapterOpen(page.html));\n  const chapterMeta = page ? app.book?.chapters.find((chapter) => chapter.id === page.chapter) : null;\n  const titlePage = !!(chapterMeta && isTitlePageChapter(chapterMeta, app.book));\n  inner.classList.toggle('chapter-open', chapterOpen);\n  inner.classList.toggle('title-page-chapter', titlePage);\n  el.classList.toggle('title-page-leaf', titlePage && chapterOpen);\n"""
          if old not in text:
              raise SystemExit('fillPage anchor not found')
          text = text.replace(old, new, 1)
          app.write_text(text, encoding='utf-8')

          exp = Path('reader/js/experience.js')
          text = exp.read_text(encoding='utf-8')
          anchor = "import { parseRoute, readHash } from './router.js';\n"
          if anchor not in text:
              raise SystemExit('experience import anchor not found')
          text = text.replace(anchor, anchor + "import { isTitlePageChapter } from './title-page.js';\n", 1)
          old = """        section.className = 'scroll-chapter';\n        section.dataset.chapter = chapter.id;\n"""
          new = """        section.className = 'scroll-chapter';\n        section.classList.toggle('title-page-chapter', isTitlePageChapter(chapter, book));\n        section.dataset.chapter = chapter.id;\n"""
          if old not in text:
              raise SystemExit('scroll chapter anchor not found')
          exp.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          cat > reader/js/title-page.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import test from 'node:test';
          import fs from 'node:fs';
          import { isTitlePageChapter } from './title-page.js';

          test('recognizes ordinary and numbered front matter', () => {
            assert.equal(isTitlePageChapter({ id: 'front-matter', title: 'Front Matter' }, {}), true);
            assert.equal(isTitlePageChapter({ id: '00-front-matter', title: 'Opening' }, {}), true);
          });

          test('recognizes an embedded canonical title page only when it opens the book', () => {
            const first = {
              id: 'book',
              title: 'Complete manuscript',
              markdown: '# Synthetic Intelligence\n\n*Subtitle*\n\n**Sven Hardy Benson**\n\n---\n\nOpening',
            };
            const second = { id: 'chapter-two', title: 'Chapter Two', markdown: first.markdown };
            const book = { title: 'Synthetic Intelligence', authors: 'Sven Hardy Benson', chapters: [first, second] };
            assert.equal(isTitlePageChapter(first, book), true);
            assert.equal(isTitlePageChapter(second, book), false);
          });

          test('does not mistake an ordinary first chapter for a title page', () => {
            const chapter = { id: 'chapter-one', title: 'Chapter One', markdown: '# Chapter One\n\nProse.' };
            const book = { title: 'Example Book', authors: 'Example Author', chapters: [chapter] };
            assert.equal(isTitlePageChapter(chapter, book), false);
          });

          test('Reader loads title-page CSS and carries title-page classes through both modes', () => {
            const index = fs.readFileSync(new URL('../index.html', import.meta.url), 'utf8');
            const app = fs.readFileSync(new URL('./app.js', import.meta.url), 'utf8');
            const experience = fs.readFileSync(new URL('./experience.js', import.meta.url), 'utf8');
            const css = fs.readFileSync(new URL('../css/title-page.css', import.meta.url), 'utf8');
            assert.match(index, /css\/title-page\.css\?v=r1/);
            assert.match(app, /title-page-chapter/);
            assert.match(app, /title-page-leaf/);
            assert.match(experience, /title-page-chapter/);
            assert.match(css, /generic chapter drop cap must never/i);
          });
          EOF
      - name: Validate Reader title-page contract
        run: |
          node --check reader/js/title-page.js
          node --check reader/js/app.js
          node --check reader/js/experience.js
          node --test reader/js/title-page.test.mjs
          git diff --check
      - name: Commit Reader title-page treatment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reader
          git commit -m "Give canonical front matter a book title-page treatment"
          git push origin HEAD:reader-title-page-treatment
