<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Course reader editorial and release flow</title>
  <desc id="desc">Four stages show candidate materials moving onto a private Desk, through permissions and editorial review, and then into a public Shelf assigned to students.</desc>
  <rect width="1200" height="640" rx="32" fill="#f4efe6"/>
  <text x="76" y="92" font-family="Georgia, serif" font-size="42" fill="#2a251f">From source packet to assigned reader</text>
  <text x="76" y="130" font-family="Arial, sans-serif" font-size="21" fill="#665f56">The editing happens before the public release boundary.</text>

  <g font-family="Arial, sans-serif">
    <rect x="72" y="210" width="220" height="250" rx="24" fill="#fffaf2" stroke="#b7aa98" stroke-width="3"/>
    <text x="100" y="258" font-size="25" font-weight="700" fill="#2a251f">Candidate material</text>
    <text x="100" y="304" font-size="20" fill="#665f56">Instructor writing</text>
    <text x="100" y="338" font-size="20" fill="#665f56">Openly licensed work</text>
    <text x="100" y="372" font-size="20" fill="#665f56">Public-domain text</text>
    <text x="100" y="406" font-size="20" fill="#665f56">Consented contribution</text>

    <rect x="362" y="210" width="220" height="250" rx="24" fill="#e8dfcf" stroke="#927f66" stroke-width="3"/>
    <text x="390" y="258" font-size="25" font-weight="700" fill="#2a251f">Private Desk</text>
    <text x="390" y="304" font-size="20" fill="#665f56">Sequence readings</text>
    <text x="390" y="338" font-size="20" fill="#665f56">Write context</text>
    <text x="390" y="372" font-size="20" fill="#665f56">Revise next edition</text>
    <text x="390" y="406" font-size="20" fill="#665f56">Keep drafts private</text>

    <rect x="652" y="210" width="220" height="250" rx="24" fill="#efe8dc" stroke="#927f66" stroke-width="3"/>
    <text x="680" y="258" font-size="25" font-weight="700" fill="#2a251f">Release check</text>
    <text x="680" y="304" font-size="20" fill="#665f56">Permissions clear?</text>
    <text x="680" y="338" font-size="20" fill="#665f56">Privacy respected?</text>
    <text x="680" y="372" font-size="20" fill="#665f56">Reader proofed?</text>
    <text x="680" y="406" font-size="20" fill="#665f56">Snapshot committed?</text>

    <rect x="942" y="210" width="186" height="250" rx="24" fill="#d8e0d1" stroke="#718069" stroke-width="3"/>
    <text x="970" y="258" font-size="25" font-weight="700" fill="#2a251f">Public Shelf</text>
    <text x="970" y="304" font-size="20" fill="#52604d">Assigned edition</text>
    <text x="970" y="338" font-size="20" fill="#52604d">Stable Reader link</text>
    <text x="970" y="372" font-size="20" fill="#52604d">Public history</text>
    <text x="970" y="406" font-size="20" fill="#52604d">Student-facing</text>

    <path d="M304 334h44" stroke="#7b6d5b" stroke-width="5" stroke-linecap="round"/>
    <path d="M338 321l14 13-14 13" fill="none" stroke="#7b6d5b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M594 334h44" stroke="#7b6d5b" stroke-width="5" stroke-linecap="round"/>
    <path d="M628 321l14 13-14 13" fill="none" stroke="#7b6d5b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M884 334h44" stroke="#7b6d5b" stroke-width="5" stroke-linecap="round"/>
    <path d="M918 321l14 13-14 13" fill="none" stroke="#7b6d5b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <line x1="652" y1="500" x2="1128" y2="500" stroke="#9a8063" stroke-width="3" stroke-dasharray="10 10"/>
  <text x="652" y="540" font-family="Arial, sans-serif" font-size="19" fill="#665f56">Deliberate public-release boundary</text>
  <text x="72" y="582" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#4d463e">Access to a work is not the same thing as permission to republish it.</text>
</svg>
