<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">A low-distance scholarly release path</title>
  <desc id="desc">A private Binder containing Markdown and media passes through one deliberate reviewed snapshot boundary into a public Shelf and Reader.</desc>
  <rect width="1200" height="680" fill="#f3efe5"/>
  <text x="600" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="38" fill="#1e2f38">Release distance</text>
  <text x="600" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5c6668">Keep the reviewed source close to the released artifact</text>

  <rect x="80" y="180" width="320" height="310" rx="24" fill="#243c49"/>
  <text x="240" y="235" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#ffffff">Private Binder</text>
  <text x="240" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#dbe4e7">working manuscript</text>
  <rect x="135" y="325" width="210" height="54" rx="8" fill="#f8f5ed"/>
  <text x="240" y="359" text-anchor="middle" font-family="monospace" font-size="18" fill="#243c49">issue.md</text>
  <rect x="135" y="397" width="210" height="54" rx="8" fill="#f8f5ed"/>
  <text x="240" y="431" text-anchor="middle" font-family="monospace" font-size="18" fill="#243c49">media/figure.svg</text>

  <line x1="400" y1="335" x2="800" y2="335" stroke="#9c8154" stroke-width="8"/>
  <polygon points="800,335 758,309 758,361" fill="#9c8154"/>
  <rect x="485" y="238" width="230" height="190" rx="22" fill="#fffdf7" stroke="#9c8154" stroke-width="4"/>
  <text x="600" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#5c4b31">REVIEWED RELEASE</text>
  <text x="600" y="327" text-anchor="middle" font-family="Georgia, serif" font-size="25" fill="#243c49">committed snapshot</text>
  <text x="600" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#5c6668">one deliberate boundary</text>
  <text x="600" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#5c6668">inspect before publishing</text>

  <rect x="800" y="180" width="320" height="310" rx="24" fill="#e0d8c5" stroke="#243c49" stroke-width="3"/>
  <text x="960" y="235" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#243c49">Public Shelf</text>
  <text x="960" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5c6668">released snapshot</text>
  <rect x="855" y="325" width="210" height="126" rx="12" fill="#fffdf7"/>
  <text x="960" y="371" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#243c49">Reader</text>
  <text x="960" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#5c6668">same Markdown + media</text>

  <text x="600" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#243c49">Private work stays private. Public reading begins at an intentional snapshot.</text>
  <text x="600" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#5c6668">Specialized research tools can exist upstream without becoming mandatory publishing infrastructure.</text>
</svg>
